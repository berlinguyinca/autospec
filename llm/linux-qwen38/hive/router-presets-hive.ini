; llama.cpp router presets — hive, RTX PRO 6000 Blackwell (95.6 GiB usable).
;
; Sized for a card with four times the reference build's memory, so three of
; that build's compromises are simply dropped:
;
;   quantisation  UD-Q8_K_XL (29.30 GiB) instead of Q5_K_M
;   KV cache      f16, NOT q4_0 -- at 32 KiB/token the full trained context is
;                 8 GiB, which is affordable here and was not on 24 GiB
;   context       the full n_ctx_train of 262,144, not a measured fraction of it
;
; Budget: 95.6 total - 29.3 weights - 8.0 KV at full context - ~4 compute
;         = ~54 GiB spare. The slot count is therefore limited by nothing that
;         matters; 8 is chosen to match the tier ladder, not the memory.
;
; Tiers ration the shared pool client-side -- llama.cpp accepts more than it can
; fund and then fails EVERY live session, so the client's declared limit is the
; only admission control there is. See ../config/router-presets.ini.
;
; No tier below 40k: this operator's p90 OpenCode session already carries 37,873
; tokens before any work is done (scripts/analyze-session-contexts.py).

version = 1

[*]
n-gpu-layers = 999
flash-attn = auto
jinja = true
no-context-shift = true
kv-unified = true

[qwen3.8-27b]
model = MODELS_DIR/Qwen3.8-27B-UD-Q8_K_XL.gguf
c = 262144
parallel = 8
alias = qwen3.8-27b-256k,qwen3.8-27b-128k,qwen3.8-27b-64k,qwen3.8-27b-40k

[qwen3.8-27b-vision]
model = MODELS_DIR/Qwen3.8-27B-UD-Q8_K_XL.gguf
mmproj = MODELS_DIR/mmproj-F16.gguf
image-min-tokens = 1024
c = 196608
parallel = 4
alias = qwen3.8-27b-vision-96k,qwen3.8-27b-vision-48k
