; llama.cpp router presets — hive, RTX PRO 6000 Blackwell (95.6 GiB usable).
;
; Four presets, covering the full matrix: text or vision, standard or
; uncensored. Each publishes context TIERS as aliases of the same loaded model,
; so switching tier inside a client costs nothing; switching model costs one
; reload (--models-max 1, and two of these will not co-reside).
;
;   qwen3.8-27b                    text,   standard    40k .. 256k
;   qwen3.8-27b-vision             vision, standard    48k .. 96k
;   qwen3.8-27b-uncensored         text,   abliterated 40k .. 256k
;   qwen3.8-27b-uncensored-vision  vision, abliterated 48k .. 96k
;
; Read the smallest tier as "fast" and the largest as "deep": they are the same
; weights at the same speed per token, but the small tier funds six concurrent
; sessions and starts answering in seconds, while the large one funds one and
; spends minutes prefilling before it says anything.
;
; Sized for four times the reference build's memory, so three of that build's
; compromises are dropped:
;
;   quantisation  Q8 instead of Q5_K_M
;   KV cache      f16, NOT q4_0 -- at 32 KiB/token the full trained context is
;                 8 GiB, affordable here and not on 24 GiB
;   context       the full n_ctx_train of 262,144, not a measured fraction
;
; Budget for the text presets: 95.6 total - ~29 weights - 8.0 KV at full
; context - ~4 compute = ~54 GiB spare. Nothing here is tight.
;
; What does NOT change from the 24 GiB build: llama.cpp accepts more sessions
; than a shared pool can fund and then fails EVERY live one, so the client's
; declared limit is the only admission control there is. And no tier sits below
; 40k, because this operator's p90 OpenCode session already carries 37,873
; tokens before any work is done (scripts/analyze-session-contexts.py).

version = 1

[*]
n-gpu-layers = 999
flash-attn = auto
jinja = true
no-context-shift = true
kv-unified = true

; --- standard, text ----------------------------------------------------------
[qwen3.8-27b]
model = MODELS_DIR/Qwen3.8-27B-UD-Q8_K_XL.gguf
c = 262144
parallel = 8
alias = qwen3.8-27b-256k,qwen3.8-27b-128k,qwen3.8-27b-64k,qwen3.8-27b-40k

; --- standard, vision --------------------------------------------------------
; The projector costs ~885 MiB and image tokens are expensive, so the pool is
; smaller than the text preset's. image-min-tokens 1024 is verified: a 256x256
; image adds ~1026 prompt tokens.
[qwen3.8-27b-vision]
model = MODELS_DIR/Qwen3.8-27B-UD-Q8_K_XL.gguf
mmproj = MODELS_DIR/mmproj-F16.gguf
image-min-tokens = 1024
c = 196608
parallel = 4
alias = qwen3.8-27b-vision-96k,qwen3.8-27b-vision-48k

; --- uncensored, text --------------------------------------------------------
; Blackfrost-AI/Qwen3.8-27B-ABLITERATED-GGUF. Q8_0 rather than the Q5_K_M the
; 24 GiB node had to settle for.
[qwen3.8-27b-uncensored]
model = MODELS_DIR/Qwen3.8-27B-ABLITERATED-Q8_0.gguf
c = 262144
parallel = 8
alias = qwen3.8-27b-uncensored-256k,qwen3.8-27b-uncensored-128k,qwen3.8-27b-uncensored-64k,qwen3.8-27b-uncensored-40k

; --- uncensored, vision ------------------------------------------------------
[qwen3.8-27b-uncensored-vision]
model = MODELS_DIR/Qwen3.8-27B-ABLITERATED-Q8_0.gguf
mmproj = MODELS_DIR/mmproj-Qwen3.8-27B-ABLITERATED-F16.gguf
image-min-tokens = 1024
c = 196608
parallel = 4
alias = qwen3.8-27b-uncensored-vision-96k,qwen3.8-27b-uncensored-vision-48k
