; llama.cpp router presets — one endpoint, one loaded model, many seats.
;
; A section name is a model id a client can ask for. `alias` adds MORE ids that
; resolve to the SAME loaded model, which is how the context tiers below work:
; switching between them in a client is free, because nothing reloads.
;
; Keys are llama-server long options without the leading dashes ("c" is
; --ctx-size). See tools/server/README.md upstream.
;
; ---------------------------------------------------------------------------
; How concurrency actually works here. Three facts, all measured on this host:
;
;   1. `c` is the TOTAL pool, not a per-session limit.
;      Log line: n_slots = 4, n_ctx_slot = 49152 for c = 196608.
;
;   2. `parallel` is how many sessions can decode at once, and it costs VRAM
;      in compute buffers -- not in KV. So seats are paid for in context:
;          parallel  4 -> 196608 pool     parallel  8 -> 163840 pool
;          parallel  6 -> 180224 pool     parallel 12 -> 131072 pool
;      Measured by measure-slot-frontier.sh. At parallel 8 with c = 196608 the
;      load dies on `cudaMalloc 872.28 MiB: out of memory`.
;
;   3. `kv-unified` decides whether sessions get equal fixed shares or draw
;      from one shared pool. It is what makes DIFFERENT context sizes per
;      session possible at all:
;          false  every slot is capped at c / parallel, hard partition
;          true   every slot may use up to all of c, first come first served
;
; The catch, and it is a sharp one: with a shared pool there is NO admission
; control. Three concurrent 80k sessions against a 196k pool were all accepted,
; prefilled for 58 seconds, and then all three died together --
;   "decode: failed to find free space in the KV cache" -> "Context size has
;    been exceeded" on task 97, 98 and 99.
; A session that was behaving is killed by a neighbour that was not.
;
; So the pool is rationed on the CLIENT side. Each `-NNk` alias below declares
; a context limit that OpenCode enforces by compacting before it is reached.
; Think in shares of 20,480 tokens, eight to a pool:
;
;   -160k  the whole pool, one session
;    -80k  two big sessions
;    -48k  three sessions
;    -40k  four sessions
;
; No tier below 40k. Measured across this operator's own OpenCode sessions,
; the context present BEFORE any work is done -- system prompt, project
; instructions, memory, skill and MCP tool schemas -- is 14,492 tokens at the
; median but 37,873 at p90. A 32k tier cannot start a p90 session at all, and
; scripts/analyze-session-contexts.py is how that was established rather than
; assumed.
;
; That p90 is a PRIMARY session's floor, and a subagent's is a different number.
; Measured 2026-08-18: a stock `general` child floored at 37,113, and the same
; child with the skill tool denied floored at 18,030 -- the skill roster alone is
; ~16.3k tokens. So a tier below 40k is defensible for children, and the reason
; there still is not one is the slot count, not the floor: at four seats a 32k
; tier would advertise six concurrent sessions against four slots, which
; tests/check_presets.py refuses.
;
; Keep the running total at or under 163,840. The remaining 16,384 of the pool
; absorbs generated tokens and fragmentation. A tier is capped by BOTH the pool
; and the slot count, and tests/check_presets.py fails the build if a tier
; advertises more sessions than there are slots to decode them.
; ---------------------------------------------------------------------------
;
; MUST be started with --models-max 1. The default is 4, and two of these
; models will not co-reside on a 24 GiB card -- the second load would OOM.
; That is also why concurrent sessions must all pick tiers of the SAME model:
; mixing a text tier with the vision id makes the router swap on every request.

version = 1

[*]
; Shared by every preset. Anything here is overridable per section.
n-gpu-layers = 999
flash-attn = auto
jinja = true
no-context-shift = true
; NO cache-reuse here, and that is a measured decision rather than an omission.
; llama.cpp disables it on this model in every configuration we can build:
;
;   multimodal preset : "cache_reuse is not supported by multimodal, it will be disabled"
;   text-only, q4_0 KV: "cache_reuse is not supported by this context, it will be disabled"
;   text-only, f16 KV : same
;   with context shift allowed instead of --no-context-shift: same
;
; Qwen3.8 keeps a recurrent state alongside its attention KV, and that state
; cannot be shifted, which is the operation cache-reuse is built on. Setting it
; buys nothing and reads like an optimisation that is running.
;
; What DOES work is ordinary exact-prefix caching, and it works very well: a
; 37k-token shared preamble costs 388 ms on a repeat instead of 14.6 s. The
; thing to protect is that prefix -- keep anything varying (session ids,
; timestamps, rotating memory) at the END of the prompt, because one changed
; token near the start throws the whole cache away. Measure with
; scripts/bench-cache-reuse.py.
; Cross-slot selection, deliberately OFF. The model child died twice
; immediately after taking that path, both times preceded by
;   slot get_availabl: ... selected slot by LCP similarity, f_sim_best = ...
; and a run with it disabled had zero child exits. A mitigation, not a
; diagnosis: the cost is losing cross-slot prompt-cache reuse, so set it back
; to 0.1 to retest on a newer llama.cpp. Only ever observed on the cluster's
; Q8 build, but the mechanism is a server code path, not a property of the
; card -- there is no reason to think this node is exempt.
slot-prompt-similarity = 0.0
cache-type-k = q4_0
cache-type-v = q4_0
; One shared pool rather than fixed equal partitions -- see fact 3 above.
kv-unified = true

; --- standard, text: four seats on one 196,608-token pool --------------------
; Verified: a single session retrieved a needle at 167,148 prompt tokens, and
; four concurrent 40k sessions ran clean.
;
; Four seats rather than six, because seats the pool cannot pay for are a trap
; rather than capacity. Six slots at the default 40,960 tier is 245,760 against a
; 180,224 pool: fill every slot and the whole house dies together, which is what
; happened on 2026-08-18 -- 48 "Context size has been exceeded" errors in one
; afternoon, all of them subagent fan-out. Four slots on the larger pool is
; 163,840, so a full house is affordable at the default tier and the failure mode
; stops being reachable by arithmetic. scripts/context-budget-check.py prices
; both bounds against the LOADED server and exits non-zero when either breaks.
[qwen3.8-27b]
model = /var/lib/qwen-gguf/models/Qwen3.8-27B-Q5_K_M.gguf
c = 196608
parallel = 4
alias = qwen3.8-27b-160k,qwen3.8-27b-80k,qwen3.8-27b-48k,qwen3.8-27b-40k

; --- standard, vision --------------------------------------------------------
; 98,304 verified by an 83,593-token retrieval WITH the projector resident.
; The 885 MiB of mmproj comes out of the same budget, so both the pool and the
; seat count are lower than the text preset.
; image-min-tokens 1024 verified: a 256x256 image adds ~1026 prompt tokens.
[qwen3.8-27b-vision]
model = /var/lib/qwen-gguf/models/Qwen3.8-27B-Q5_K_M.gguf
mmproj = /var/lib/qwen-gguf/models/mmproj-F16.gguf
image-min-tokens = 1024
c = 98304
parallel = 4
alias = qwen3.8-27b-vision-96k,qwen3.8-27b-vision-48k

; --- uncensored, text --------------------------------------------------------
; Blackfrost-AI/Qwen3.8-27B-ABLITERATED-GGUF @ 4f6732ce2123.
; Deliberately loads NO projector: the previous single preset always paid the
; 885 MiB, which bought vision for sessions that never sent an image and cost
; them roughly 80k tokens of context. Verified at 148,242 prompt tokens.
; `qwen3.8-27b-abliterated` stays as an alias so selections made before the
; rename keep resolving.
[qwen3.8-27b-uncensored]
model = /var/lib/qwen-gguf/models/Qwen3.8-27B-ABLITERATED-Q5_K_M.gguf
c = 163840
parallel = 4
alias = qwen3.8-27b-abliterated,qwen3.8-27b-uncensored-160k,qwen3.8-27b-uncensored-80k,qwen3.8-27b-uncensored-48k,qwen3.8-27b-uncensored-40k

; --- uncensored, vision ------------------------------------------------------
; Verified: +1026 image tokens on a 256x256 chessboard, answered "chess".
[qwen3.8-27b-uncensored-vision]
model = /var/lib/qwen-gguf/models/Qwen3.8-27B-ABLITERATED-Q5_K_M.gguf
mmproj = /var/lib/qwen-gguf/models/mmproj-Qwen3.8-27B-ABLITERATED-F16.gguf
image-min-tokens = 1024
c = 98304
parallel = 4
alias = qwen3.8-27b-uncensored-vision-96k,qwen3.8-27b-uncensored-vision-48k
