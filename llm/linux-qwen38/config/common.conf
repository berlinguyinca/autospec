# Qwen3.8-27B / vLLM Linux inference node — settings shared by every profile.
#
# Single source of truth. The launcher, the systemd units, the structural tests
# and the benchmark harness all read this file; changing a value here changes
# all of them together.
#
# shellcheck shell=bash

# --- install locations -------------------------------------------------------
QWEN38_PREFIX="/opt/qwen-vllm"
QWEN38_VENV="${QWEN38_PREFIX}/venv"
QWEN38_STATE="/var/lib/qwen-vllm"
QWEN38_MODELS="${QWEN38_STATE}/models"
QWEN38_RESULTS="${QWEN38_STATE}/results"
QWEN38_LOGS="${QWEN38_STATE}/logs"

# --- pinned runtime ----------------------------------------------------------
# vLLM 0.27.1 is the first *released* tag that registers the hybrid
# Qwen3_5ForConditionalGeneration architecture and Qwen3_5MTP. Verified against
# vllm/model_executor/models/registry.py at tags v0.26.0, v0.27.0 and v0.27.1.
# No source build and no patches are required; see ../patches/README.md.
QWEN38_VLLM_VERSION="0.27.1"

# --- served model ------------------------------------------------------------
# W4A16 (compressed-tensors "pack-quantized", group_size 32, asymmetric).
# Pinned by revision: the served weights must never change under a profile
# without a profile version bump. See config/model-artifacts.yaml.
QWEN38_MODEL_REPO="cyankiwi/Qwen3.8-27B-AWQ-INT4"
QWEN38_MODEL_REVISION="63768c10df38c0395e12ef49edac1bd539eaeeea"
QWEN38_SERVED_NAME="qwen3.8-27b"

# --- network -----------------------------------------------------------------
# Port 8000, deliberately NOT 8080: the llama.cpp node from the Apple/Linux
# "qwen-local" spec owns 8080 on this host. Distinct ports let either runtime be
# started for comparison without editing unit files. Both bind loopback only;
# LAN exposure is opt-in via QWEN38_HOST in a drop-in.
QWEN38_HOST="127.0.0.1"
QWEN38_PORT="8000"

# Optional bearer token. Empty means no auth, which is only acceptable while the
# server is loopback-bound. Set this before ever changing QWEN38_HOST.
QWEN38_API_KEY=""

# --- KV cache ----------------------------------------------------------------
# fp8 KV. Qwen3.8-27B is hybrid: of 64 layers only 16 are full_attention
# (full_attention_interval=4); the other 48 are linear/GDN.
#
#   raw attention KV = 2 * 16 full-attn layers * 4 kv_heads * 256 head_dim
#                    = 32768 B = 32 KiB/token
#
# vLLM confirms this figure ("8.18 GiB KV cache is needed" for 262144 tokens
# = 32.7 KiB/token). But the *effective* cost is about twice that, because the
# hybrid allocator pads the mamba page size to equal the attention page size
# and serves both from one pool -- see docs/measured-ceilings.md.
QWEN38_KV_DTYPE="fp8"

# Peak activation memory scales with this. It is the second-biggest lever on how
# much VRAM is left for KV after weights, and 1568 is not arbitrary: vLLM sets
# the attention block size to 1568 tokens on this model so the attention and
# mamba page sizes match, so this is exactly one block.
QWEN38_MAX_BATCHED_TOKENS="1568"

# CUDA graphs cost ~2.5 GiB on this model -- measured, and by far the largest
# single claim on VRAM after the weights themselves. Disabling them nearly
# triples the KV pool (25,486 -> 73,728 tokens). Profiles that want context set
# this to 1; the profile that wants generation speed leaves it 0 and accepts a
# much smaller context.
QWEN38_ENFORCE_EAGER="0"

# --- workaround: FlashInfer sampler ------------------------------------------
# WORKAROUND (2026-08-17). vLLM 0.27.1 defaults VLLM_USE_FLASHINFER_SAMPLER=1.
# FlashInfer JIT-compiles its sampling kernels on the first request, and on this
# host that compile fails:
#
#   flashinfer/data/include/flashinfer/sampling.cuh(623): error:
#   class "cub::_V_300302_SM_890::BlockAdjacentDifference<__nv_bool,512,1,1>"
#   has no member "FlagHeads"
#
# FlashInfer's sampling.cuh still calls the CUB BlockAdjacentDifference::FlagHeads
# API, which was removed in the CUB that ships with CUDA 13 (torch 2.13 is
# +cu130). The engine dies with "Engine core initialization failed", minutes into
# startup and only on the first real request -- so it looks like a runtime fault,
# not a build problem.
#
# Setting this to 0 falls back to PyTorch-native sampling. Correctness is
# unaffected; the cost is some sampling throughput.
#
# REMOVE WHEN: FlashInfer ships a CUDA 13-compatible sampling.cuh, or vLLM pins
# a FlashInfer that does. Re-test by setting this to 1 and issuing one request.
QWEN38_USE_FLASHINFER_SAMPLER="0"

# --- guards ------------------------------------------------------------------
# Refuse to start if another process already holds most of the GPU. Without this
# vLLM's profiling run OOMs several minutes into startup with an opaque error.
QWEN38_MIN_FREE_VRAM_MIB="20000"
