# Profile E — long context (llama.cpp + GGUF Q5_K_M)
#
# The profile for real work on a large repository. It exists because the vLLM
# profiles cannot serve the context that job needs: their verified ceiling is
# 56,448 tokens, and this one is verified at 153,038.
#
# It is also, awkwardly, better than the vLLM profiles on quality: 5-bit weights
# versus the 4-bit W4A16 checkpoint, at essentially the same file size. See
# ../../docs/runtime-comparison.md for why the 4-bit checkpoint is so large.
#
# Measured on this host (llama-bench, q4_0 KV, generation tok/s by depth):
#        0 -> 41.9      65,536 -> 35.2
#   16,384 -> 39.8     131,072 -> 30.2
#   32,768 -> 38.2     196,608 -> 27.0
# Through the OpenAI API at ctx 196608 the sustained rate is 33.0 tok/s, and a
# 153,038-token needle retrieval completed correctly in 89s.
#
# shellcheck shell=bash

QWEN38_PROFILE="longcontext"
QWEN38_PROFILE_VERSION="qwen38-linux-gguf-q5km-v1"
QWEN38_RUNTIME="llama.cpp"

QWEN38_GGUF_PATH="/var/lib/qwen-gguf/models/Qwen3.8-27B-Q5_K_M.gguf"
QWEN38_GGUF_REPO="unsloth/Qwen3.8-27B-GGUF"
QWEN38_GGUF_QUANT="Q5_K_M"

# 196,608 fits with ~800 MiB to spare: 18.46 GiB weights + ~3.5 GiB of q4_0 KV
# + compute buffers = 23,254 MiB of 24,564. Raising this or the KV precision
# will not fit -- q8_0 KV at this depth needs ~6.1 GiB.
QWEN38_MAX_MODEL_LEN="196608"
QWEN38_MAX_SEQS="1"

# q4_0, not q8_0. This is the same fallback the pre-existing qwen-local node
# reached independently, for the same reason.
QWEN38_KV_TYPE="q4_0"

# Distinct port so this can run alongside nothing else but still be probed
# without disturbing whichever vLLM profile owns 8000.
QWEN38_PORT="8081"

QWEN38_MULTIMODAL="off"
