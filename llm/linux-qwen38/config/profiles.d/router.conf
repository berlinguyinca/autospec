# Profile R — router (llama.cpp router mode)
#
# One endpoint, one loaded model, several seats. Selecting a different context
# tier in the client is the whole switch -- no qwen38ctl call, no port change,
# and for tiers of the same model, no reload either.
#
# This is the profile to run by default. The single-model profiles remain for
# benchmarking and for pinning a known configuration.
#
# Serves (see ../router-presets.ini for the full reasoning):
#   qwen3.8-27b          Q5_K_M, 180,224-token shared pool, 6 slots, text only
#     -160k -80k -40k -32k   context tiers; same weights, no reload to switch
#   qwen3.8-27b-vision   Q5_K_M + F16 projector, 98,304 pool, 4 slots
#   qwen3.8-27b-abliterated  uncensored, 163,840 pool, 4 slots
#
# Switching between two different MODELS costs a reload (roughly a model-load
# time on the first request after the switch; the page cache makes it fast
# since the text and vision presets share a weights file). Switching between
# TIERS of one model costs nothing at all.
#
# The one thing to get right: concurrent sessions must all sit on tiers of the
# SAME model. --models-max is 1, so a text session and a vision session running
# at once make the router unload and reload on every single request.
#
# shellcheck shell=bash

QWEN38_PROFILE="router"
QWEN38_PROFILE_VERSION="qwen38-linux-gguf-q5km-router-v2"
QWEN38_RUNTIME="llama.cpp"

QWEN38_ROUTER_PRESETS="/opt/qwen-vllm/etc/router-presets.ini"

# ONE. The default is 4 and would try to hold several 18.5 GiB models at once.
QWEN38_ROUTER_MAX_LOADED="1"

# 8080: the port the llama.cpp node has always used on this host, so clients
# configured before any of this work still resolve. qwen-local.service is
# disabled and the unit declares Conflicts= with it, so they cannot collide.
QWEN38_PORT="8080"

# Not used in router mode -- the presets file owns per-model context, slots and
# KV -- but kept non-empty so shared tooling that reads these keys does not trip.
QWEN38_MAX_MODEL_LEN="180224"
QWEN38_MAX_SEQS="6"
QWEN38_KV_TYPE="q4_0"
QWEN38_MULTIMODAL="on"
