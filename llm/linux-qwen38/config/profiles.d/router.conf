# Profile R — router (llama.cpp router mode)
#
# One endpoint that serves several models and swaps between them on demand,
# driven by the "model" field of each request. Selecting a different model in
# the client is the whole switch -- no qwen38ctl call, no port change.
#
# This is the profile to run by default. The single-model profiles remain for
# benchmarking and for pinning a known configuration.
#
# Serves (see ../router-presets.ini):
#   qwen3.8-27b          Q5_K_M, 196,608 ctx, text only
#   qwen3.8-27b-vision   Q5_K_M + F16 projector, 98,304 ctx
#
# The swap costs a model reload, so it is convenient, not free: expect a pause
# of roughly a model-load time on the first request after switching. Both
# presets share the same weights file, so the page cache makes that fast.
#
# shellcheck shell=bash

QWEN38_PROFILE="router"
QWEN38_PROFILE_VERSION="qwen38-linux-gguf-q5km-router-v1"
QWEN38_RUNTIME="llama.cpp"

QWEN38_ROUTER_PRESETS="/opt/qwen-vllm/etc/router-presets.ini"

# ONE. The default is 4 and would try to hold several 18.5 GiB models at once.
QWEN38_ROUTER_MAX_LOADED="1"

# 8080: the port the llama.cpp node has always used on this host, so clients
# configured before any of this work still resolve. qwen-local.service is
# disabled and the unit declares Conflicts= with it, so they cannot collide.
QWEN38_PORT="8080"

# Not used in router mode -- the presets file owns per-model context and KV --
# but kept non-empty so shared tooling that reads these keys does not trip.
QWEN38_MAX_MODEL_LEN="196608"
QWEN38_MAX_SEQS="1"
QWEN38_KV_TYPE="q4_0"
QWEN38_MULTIMODAL="on"
