# Profile A — interactive
#
# One AutoSpec worker doing implementation / interactive coding. This is the
# profile that starts at boot. It optimises for single-request generation speed,
# which on this hardware means keeping CUDA graphs — and paying for them with a
# much smaller context than the other vLLM profiles offer.
#
# shellcheck shell=bash

QWEN38_PROFILE="interactive"
QWEN38_PROFILE_VERSION="qwen38-linux-vllm-w4a16-v1"

# 39,200 is vLLM's own estimate for this configuration, and it is the value that
# survives a long prompt. Two larger numbers are wrong and are recorded here so
# they are not "rediscovered":
#   66,446  the "GPU KV cache size" pool figure -- an aggregate, not a per-request
#           limit, and not comparable to max_model_len.
#  109,760  the estimate obtained by probing at the 262144 training context.
#           It starts, serves a short request, and then OOMs on a ~70k prompt.
QWEN38_MAX_MODEL_LEN="39200"
QWEN38_MAX_SEQS="1"

# 0.97 is the practical maximum on this host, not a round number: ~0.7 GiB of
# the card is held by the desktop, and 0.985 is refused outright with
# "Free memory on device cuda:0 (22.78/23.48 GiB)".
QWEN38_GPU_MEM_UTIL="0.97"

# CUDA graphs ON — that is the entire point of this profile.
QWEN38_ENFORCE_EAGER="0"

# Larger than one block, because this profile trades KV for prefill throughput.
QWEN38_MAX_BATCHED_TOKENS="2048"

# OFF, pending measurement. MTP (Qwen3_5MTP, mtp_num_hidden_layers=1) should
# help single-stream latency, which is what this profile optimises for -- but
# "should" is not a measurement, and this profile is the one that starts at
# boot. The method string "qwen3_5_mtp" is confirmed valid in the installed
# vLLM (config/speculative.py:49); what is unconfirmed is whether it helps here
# and what it costs in VRAM -- and VRAM is the binding constraint on this card.
# Turn on only after the speculative_decoding suite in benchmark-profile.yaml
# has run. See docs/measured-ceilings.md.
QWEN38_MTP="off"

# Text-only. Measured: the checkpoint is 19.57 GiB on disk but loads as
# 18.37 GiB in text-only mode. The AutoSpec coding worker never sends images.
QWEN38_MULTIMODAL="off"
