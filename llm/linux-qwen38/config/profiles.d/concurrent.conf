# Profile B — concurrent
#
# Several AutoSpec agents in parallel: implementation jobs, test generation,
# documentation, batch analysis.
#
# CONCURRENCY AND CONTEXT COME OUT OF ONE POOL. The spec assumed per-sequence
# recurrent state would bound concurrency independently of context. Measured, it
# does not: the KV pool was 73,728 tokens at seqs=1 and 75,548 at seqs=8 —
# essentially unchanged. vLLM pads the mamba page size to equal the attention
# page size and serves both from the same block pool, so what actually binds is
#
#     concurrency ~= pool_tokens / max_model_len
#
# Raising QWEN38_MAX_SEQS beyond that ratio buys nothing; requests just queue.
#
# shellcheck shell=bash

QWEN38_PROFILE="concurrent"
QWEN38_PROFILE_VERSION="qwen38-linux-vllm-w4a16-v1"

# eager + batched 1568 gives a 75,548-token pool at util 0.97 ("Maximum
# concurrency for 8,192 tokens per request: 9.22x") -- but util 0.97 leaves too
# little VRAM for FlashInfer's 394 MiB workspace and every request 500s with
# EngineDeadError. At util 0.94 the pool is ~60k, so 6 x 8192 fits with margin.
QWEN38_MAX_MODEL_LEN="8192"
QWEN38_MAX_SEQS="6"

QWEN38_GPU_MEM_UTIL="0.94"

# Eager: CUDA graphs cost ~2.5 GiB, which here is worth ~5 concurrent slots.
QWEN38_ENFORCE_EAGER="1"

QWEN38_MAX_BATCHED_TOKENS="1568"

# Off: speculative decoding competes with continuous batching for the same
# compute, and the batch already keeps the GPU busy.
QWEN38_MTP="off"

QWEN38_MULTIMODAL="off"
