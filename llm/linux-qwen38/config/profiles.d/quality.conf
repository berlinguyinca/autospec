# Profile D — high quality (llama.cpp / GGUF comparison and fallback)
#
# Deliberately NOT vLLM. This profile is the quantisation-regression control:
# a higher-fidelity GGUF served by the already-installed llama.cpp build, used
# to judge whether the W4A16 vLLM profiles have lost model quality. It is not
# expected to match vLLM throughput.
#
# This profile is served by the pre-existing `qwen-local` llama.cpp deployment
# rather than by serve-profile.sh, so that the two runtimes stay independently
# installable. scripts/qwen38ctl delegates to `qwen-localctl` for it.
#
# shellcheck shell=bash

QWEN38_PROFILE="quality"
QWEN38_PROFILE_VERSION="qwen38-linux-gguf-q6-v1"
QWEN38_RUNTIME="llama.cpp"

# Q6_K rather than the Q4_K_M the resident qwen-local service ships, because the
# point of this profile is to be the quality reference. Q6_K weights are ~22 GiB
# and will NOT co-reside with a large KV cache on 24 GiB — expect a much smaller
# context here than the vLLM profiles offer.
QWEN38_GGUF_REPO="ggml-org/Qwen3.8-27B-GGUF"
QWEN38_GGUF_QUANT="Q6_K"

QWEN38_DELEGATE_CTL="qwen-localctl"
QWEN38_PORT="8080"

# The llama.cpp deployment loads the Q8 vision projector (--mmproj-auto), so
# unlike the vLLM profiles this one genuinely does serve images. The router
# reads this, so it must not inherit the text-only default.
QWEN38_MULTIMODAL="on"

# Deliberately unset: QWEN38_MAX_MODEL_LEN. The llama.cpp node's context is
# owned by /opt/qwen-local/etc/qwen-local.conf, and duplicating it here would
# create two sources of truth that silently disagree. The descriptor reports
# null rather than a guess.
