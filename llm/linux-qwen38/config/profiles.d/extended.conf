# Profile C — extended context
#
# Repository-wide analysis and architectural review. Buys context by giving up
# both concurrency and CUDA graphs: one sequence, eager execution, everything
# else spent on KV.
#
# This is the largest context this hardware serves, and it is well short of the
# 180K-200K the spec hoped for. The reason is not tuning — it is that the
# checkpoint occupies 18.37 GiB of a 24 GiB card. See docs/measured-ceilings.md.
#
# shellcheck shell=bash

QWEN38_PROFILE="extended"
QWEN38_PROFILE_VERSION="qwen38-linux-vllm-w4a16-v1"

# 73,728 tokens is reachable at util 0.97 -- but only until the first request,
# which OOMs allocating FlashInfer's 394 MiB workspace buffer (vLLM's memory
# profiling does not reserve it, so the server starts healthy and dies on use).
# util 0.94 keeps ~1 GiB back for it; 56448 = 36 x the 1568-token block size.
QWEN38_MAX_MODEL_LEN="56448"
QWEN38_MAX_SEQS="1"

QWEN38_GPU_MEM_UTIL="0.94"

# Eager: the ~2.5 GiB CUDA graphs would cost is worth ~48,000 tokens here.
QWEN38_ENFORCE_EAGER="1"

QWEN38_MAX_BATCHED_TOKENS="1568"

# Off: the MTP draft head costs VRAM that is worth more as context here.
QWEN38_MTP="off"

QWEN38_MULTIMODAL="off"
