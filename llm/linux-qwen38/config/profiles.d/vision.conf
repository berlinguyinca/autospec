# Profile F — vision (llama.cpp + GGUF Q5_K_M + F16 projector)
#
# Same weights as `longcontext`, plus the multimodal projector, and therefore a
# smaller context: the projector is 885 MiB and the card has no room for both it
# and 196k of KV.
#
# Measured budget on this host (24,564 MiB total):
#   18,903  Q5_K_M weights
#      885  mmproj-F16
#      800  compute buffers
#    1,766  q4_0 KV at 98,304 tokens (~18.4 KiB/token)
#   ------
#   22,354  leaving ~2.2 GiB for image encoding
#
# 131,072 leaves only ~1.6 GiB and 196,608 does not fit at all (~437 MiB), which
# is why `longcontext` is text-only rather than simply always loading vision.
#
# shellcheck shell=bash

QWEN38_PROFILE="vision"
QWEN38_PROFILE_VERSION="qwen38-linux-gguf-q5km-vision-v1"
QWEN38_RUNTIME="llama.cpp"

QWEN38_GGUF_PATH="/var/lib/qwen-gguf/models/Qwen3.8-27B-Q5_K_M.gguf"
QWEN38_GGUF_REPO="unsloth/Qwen3.8-27B-GGUF"
QWEN38_GGUF_QUANT="Q5_K_M"

# Setting this is what turns vision on; the launcher passes --mmproj only when
# it is non-empty, so every other llama.cpp profile stays text-only by default.
QWEN38_MMPROJ_PATH="/var/lib/qwen-gguf/models/mmproj-F16.gguf"

# Minimum tokens spent per image. Below ~1024 the model reads small text and
# fine detail in screenshots poorly, which is most of what a vision profile is
# for on a coding box.
QWEN38_IMAGE_MIN_TOKENS="1024"

QWEN38_MAX_MODEL_LEN="98304"
QWEN38_MAX_SEQS="1"
QWEN38_KV_TYPE="q4_0"

QWEN38_PORT="8082"
QWEN38_MULTIMODAL="on"
