# The ONLY public listener on this node.
#
# llama.cpp (127.0.0.1:8090) and the dashboard (127.0.0.1:8081) both bind
# loopback, so neither is reachable directly even from inside the LAN and the
# firewall has exactly one port to reason about.
#
# One port works because the namespaces do not collide:
#   llama.cpp : /v1/*  /completion  /health  /props  /metrics  /slots  ...
#   dashboard : /  /status  /api/*  and a SANITISED /v1/models
#
# NOTE: nginx is therefore a single point of failure for inference. A dead proxy
# is a dead endpoint. That was accepted deliberately in exchange for queue
# headers and for moving both backends off every public interface.

upstream qwen_llama     { server 127.0.0.1:8090; keepalive 8; }
upstream qwen_dashboard { server 127.0.0.1:8081; keepalive 4; }

server {
    listen 80 default_server;
    listen 8080;                    # clients configured before the move

    server_name _;

    # A full-context prompt is ~230 KB at 40k tokens and larger at 100k.
    client_max_body_size 512m;

    # Both directions unbuffered. Completions stream token by token, and a
    # buffered request body would add minutes of latency to a 100k prompt.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_http_version 1.1;

    # Sized from MEASURED prefill: ~210 s before the first token at 100k, and
    # 114 s wall clock for two concurrent 40k sessions. nginx's 60 s default
    # would sever exactly the requests this node exists to serve.
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    # --- queue headers, from a subrequest that must never reject -------------
    # /api/queue-headers reads a cached snapshot and always answers 204 -- it
    # measured 10.8 ms per call. Timeouts here are bounded FAR below
    # proxy_read_timeout so a wedged dashboard costs headers within a second
    # rather than stalling an inference request for 900 s.
    location = /internal-queue-headers {
        internal;
        proxy_pass http://qwen_dashboard/api/queue-headers;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 1s;
        proxy_send_timeout    1s;
        proxy_read_timeout    2s;
    }

    # --- sanitised model list -----------------------------------------------
    # NOT llama.cpp's: upstream publishes the child argv without a key,
    # including the API key's file location.
    location = /v1/models {
        proxy_pass http://qwen_dashboard/v1/models;
        proxy_set_header Host $host;
    }

    # llama.cpp's non-standard twin would defeat the sanitising above.
    location = /models { return 403; }

    # --- inference ----------------------------------------------------------
    location ~ ^/(v1|completion|completions|health|props|metrics|slots|tokenize|detokenize|embedding|embeddings|infill|apply-template|reranking|rerank) {
        auth_request /internal-queue-headers;
        auth_request_set $q_slots      $upstream_http_x_queue_slots;
        auth_request_set $q_processing $upstream_http_x_queue_processing;
        auth_request_set $q_depth      $upstream_http_x_queue_depth;
        auth_request_set $q_full       $upstream_http_x_queue_fullness;
        auth_request_set $q_wait       $upstream_http_x_queue_est_wait_seconds;

        add_header X-Queue-Slots            $q_slots      always;
        add_header X-Queue-Processing       $q_processing always;
        add_header X-Queue-Depth            $q_depth      always;
        add_header X-Queue-Fullness         $q_full       always;
        add_header X-Queue-Est-Wait-Seconds $q_wait       always;

        # nginx turns a failed auth_request into an error for the CLIENT, so a
        # dead or slow dashboard would otherwise take inference down with it.
        # This maps a subrequest failure onto a path that proxies WITHOUT
        # headers. Losing headers is acceptable; losing service is not.
        error_page 500 502 503 504 = @inference_no_headers;

        proxy_pass http://qwen_llama;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    location @inference_no_headers {
        proxy_pass http://qwen_llama;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }

    # --- dashboard ----------------------------------------------------------
    location / {
        proxy_pass http://qwen_dashboard;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }
}

# --- TLS, prepared but NOT enabled -------------------------------------------
# Uncomment once the campus CA has issued into /etc/ssl/qwen-turing/, then
#     ufw allow from <campus-cidr> to any port 443 proto tcp
#
# Deliberately absent until then: any HTTP->HTTPS redirect and any HSTS header.
# A redirect to a port that is not listening breaks the endpoint outright, and an
# HSTS header cached before a valid certificate exists makes the node unreachable
# from every browser that saw it. tests/test_structural.sh check 9 fails the
# build if either appears before the certificate does.
#
