# The ONLY public listener on this node.
#
# llama.cpp (127.0.0.1:8090) and the dashboard (127.0.0.1:8081) both bind
# loopback, so neither is reachable directly even from inside the LAN and the
# firewall has exactly one port to reason about.
#
# One port works because the namespaces do not collide:
#   llama.cpp : /v1/*  /completion  /health  /props  /metrics  /slots  ...
#   dashboard : /  /status  /api/*  and a SANITISED /v1/models
#
# NOTE: nginx is therefore a single point of failure for inference. A dead proxy
# is a dead endpoint. That was accepted deliberately in exchange for queue
# headers and for moving both backends off every public interface.

upstream qwen_gateway   { server 127.0.0.1:8082; keepalive 8; }
upstream qwen_dashboard { server 127.0.0.1:8081; keepalive 4; }

# llama.cpp itself. DELIBERATELY NOT REFERENCED BY ANY CLIENT-REACHABLE
# LOCATION: every inference request goes through the gateway, which is what
# authenticates it. tests/test_structural.sh fails the build if that stops being
# true, because the failure is silent -- inference keeps working, unauthenticated.
# Kept defined so the intent, and the reason, are visible here.
#   upstream qwen_llama { server 127.0.0.1:8090; }

server {
    listen 80 default_server;
    listen 8080;                    # clients configured before the move

    # TLS, if this node has a certificate. The installer writes this file: the
    # listen/ssl_* directives when /etc/ssl/qwen-turing/fullchain.pem exists,
    # and a comment when it does not.
    #
    # It is an include rather than inline directives because `listen 443 ssl`
    # against a missing certificate makes nginx refuse to START -- which would
    # take plain :80 down with it on any node that has no cert yet.
    include /etc/nginx/snippets/qwen-turing-tls.conf;

    # No hostname here on purpose: this file is public. The certificate lives
    # behind /etc/ssl/qwen-turing/, symlinked to wherever the ACME client put
    # it, so the site's own name stays out of the repository.
    server_name _;

    # A full-context prompt is ~230 KB at 40k tokens and larger at 100k.
    client_max_body_size 512m;

    # Both directions unbuffered. Completions stream token by token, and a
    # buffered request body would add minutes of latency to a 100k prompt.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_http_version 1.1;

    # Sized from MEASURED prefill: ~210 s before the first token at 100k, and
    # 114 s wall clock for two concurrent 40k sessions. nginx's 60 s default
    # would sever exactly the requests this node exists to serve.
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    # --- queue headers, from a subrequest that must never reject -------------
    # /api/queue-headers reads a cached snapshot and always answers 204 -- it
    # measured 10.8 ms per call. Timeouts here are bounded FAR below
    # proxy_read_timeout so a wedged dashboard costs headers within a second
    # rather than stalling an inference request for 900 s.
    location = /internal-queue-headers {
        internal;
        proxy_pass http://qwen_dashboard/api/queue-headers;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 1s;
        proxy_send_timeout    1s;
        proxy_read_timeout    2s;
    }

    # --- the agent's connections --------------------------------------------
    # A server that dials IN: one long-lived control connection plus a few idle
    # pipes, each of which carries exactly one HTTP conversation.
    #
    # `Connection` is a literal rather than the usual `map $http_upgrade` at http
    # level, because this location serves nothing but WebSocket and this file is
    # a server block that must stay self-contained -- a map would mean editing
    # nginx.conf on every node.
    location ^~ /api/agent/ {
        proxy_pass http://qwen_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # The gateway refuses an agent credential presented in cleartext, and
        # this is what tells it which it was.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        # An idle pipe carries no traffic, so it would be reaped here. The node
        # pings each one every PIPE_KEEPALIVE_SECONDS (240), which must stay well
        # inside this -- tests/test_structural.sh compares the two numbers.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # --- sanitised model list, for the whole fleet ---------------------------
    # NOT llama.cpp's: upstream publishes the child argv without a key, including
    # the API key's file location. And not the dashboard's either any more: this
    # answers with the UNION of what every pooled server serves, which only the
    # gateway knows. It reuses the dashboard's sanitiser rather than repeating it.
    #
    # Still public: a client needs discovery before it has a key, and remote
    # entries are ids only -- which server holds what is in the authenticated
    # /api/servers.
    location = /v1/models {
        proxy_pass http://qwen_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # llama.cpp's non-standard twin would defeat the sanitising above.
    location = /models { return 403; }

    # --- inference ----------------------------------------------------------
    # Routed inference: /u/<server>/v1/... and the virtual /u/auto/v1/... .
    # Same location body as local inference below, because it IS inference -- the
    # unbuffered streaming and the 900 s timeout matter just as much when the
    # tokens come from another machine.
    location ^~ /u/ {
        auth_request /internal-queue-headers;
        auth_request_set $rq_wait $upstream_http_x_queue_est_wait_seconds;
        add_header X-Queue-Est-Wait-Seconds $rq_wait always;
        error_page 500 502 503 504 = @inference_no_headers;
        proxy_pass http://qwen_gateway;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(v1|completion|completions|health|props|metrics|slots|tokenize|detokenize|embedding|embeddings|infill|apply-template|reranking|rerank) {
        auth_request /internal-queue-headers;
        auth_request_set $q_slots      $upstream_http_x_queue_slots;
        auth_request_set $q_processing $upstream_http_x_queue_processing;
        auth_request_set $q_depth      $upstream_http_x_queue_depth;
        auth_request_set $q_full       $upstream_http_x_queue_fullness;
        auth_request_set $q_wait       $upstream_http_x_queue_est_wait_seconds;

        add_header X-Queue-Slots            $q_slots      always;
        add_header X-Queue-Processing       $q_processing always;
        add_header X-Queue-Depth            $q_depth      always;
        add_header X-Queue-Fullness         $q_full       always;
        add_header X-Queue-Est-Wait-Seconds $q_wait       always;

        # nginx turns a failed auth_request into an error for the CLIENT, so a
        # dead or slow dashboard would otherwise take inference down with it.
        # This maps a subrequest failure onto a path that proxies WITHOUT
        # headers. Losing headers is acceptable; losing service is not.
        error_page 500 502 503 504 = @inference_no_headers;

        proxy_pass http://qwen_gateway;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The queue-header subrequest may fail without taking inference down -- but
    # this fallback goes to the GATEWAY, not to llama.cpp. Sending it to llama.cpp
    # would be an authentication bypass: error_page is scoped to the location, so
    # it catches the gateway's OWN 502 as readily as a dashboard timeout, and
    # would then serve the request from a backend that authenticates nothing.
    # Fail open for telemetry; fail closed for auth.
    location @inference_no_headers {
        proxy_pass http://qwen_gateway;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- login and key management -------------------------------------------
    # ^~ so these beat the inference regex above. X-Forwarded-Proto is how the
    # gateway knows whether a key would be minted over cleartext; nothing else
    # can set it, because the gateway binds loopback and is reached only here.
    location ^~ /auth/ {
        proxy_pass http://qwen_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/keys {
        proxy_pass http://qwen_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The dashboard's numbers, but authorised by the gateway -- so signing in is
    # enough to read the page. The dashboard itself still serves it; the gateway
    # holds its key and is the only caller.
    location = /api/stats {
        proxy_pass http://qwen_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/servers {
        proxy_pass http://qwen_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/me {
        proxy_pass http://qwen_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/usage {
        proxy_pass http://qwen_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/gateway-health {
        proxy_pass http://qwen_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- dashboard ----------------------------------------------------------
    location / {
        proxy_pass http://qwen_dashboard;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }
}

# --- TLS ---------------------------------------------------------------------
# Enabled through the include above, never by editing this file. The installer
# emits /etc/nginx/snippets/qwen-turing-tls.conf; see install-node.sh.
#
# Certificate paths are deliberately indirect:
#     /etc/ssl/qwen-turing/fullchain.pem -> the ACME client's live/ directory
#     /etc/ssl/qwen-turing/privkey.pem   -> likewise
# Renewal rewrites the ACME client's files in place, so the symlinks never need
# touching and no reload logic depends on a certificate's name.
#
# STILL DELIBERATELY ABSENT, now that a real certificate exists:
#   * any HTTP->HTTPS redirect. Clients are configured against :80 and :8080
#     today; redirecting them would break every one that does not follow.
#   * any HSTS header. HSTS is a promise a browser caches and will not forget.
#     Making it before the whole surface is known-good over TLS risks locking
#     operators out of their own dashboard. tests/test_structural.sh check 9
#     fails the build if either appears.
