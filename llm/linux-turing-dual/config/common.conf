# Dual-Turing Qwen node -- settings shared by every script and unit.
#
# Single source of truth. The launcher, the systemd units, the structural tests
# and the stats collector all read this file; changing a value here changes all
# of them together. Site-specific values (address, interface, model path) are
# NOT here -- they come from site.sh / site.conf, because this repository is
# public.
#
# shellcheck shell=bash

# --- install locations -------------------------------------------------------
QT_PREFIX="/opt/qwen-turing"
QT_STATE="/var/lib/qwen-turing"
QT_LLAMA_DIR="${QT_PREFIX}/llama.cpp/current"
QT_VRAM_GUARD="${QT_PREFIX}/bin/vram-guard.sh"

# --- pinned runtime ----------------------------------------------------------
# A release tag, not master. "The latest build" is not a configuration anyone
# can reproduce, and this project has already been burned by a build that ran
# only on the machine that compiled it.
#
# b10502 verified to document every flag this node passes: --models,
# --models-max, --no-webui, --metrics, --slot-prompt-similarity, --api-key,
# --tensor-split, --split-mode, --cache-reuse, --kv-unified. A tag that lacks
# one of those must not be substituted without re-checking.
QT_LLAMA_TAG="b10502"

# sm_75. These are Turing (TU102) cards: no bf16, no FP8, no NVFP4, no Marlin.
# Building without this pin produces a binary that either will not run here or
# runs only here.
QT_CUDA_ARCHS="75"

# Build for a portable CPU baseline rather than the build host's native arch.
QT_GGML_NATIVE="OFF"

# --- VRAM guard --------------------------------------------------------------
# TOTAL free MiB across the visible cards. This is a TOTAL, not a per-card
# figure: the single-card version of this check read nvidia-smi's first row and
# refused to start a two-card node that fits. 22528 MiB is the pair; 19000
# leaves room for the desktop-free driver overhead and still fails fast if
# something else has grabbed a card.
QT_MIN_FREE_VRAM_MIB="19000"

# Best single card. Only binds for a model PINNED to one device -- the 9B needs
# ~7.1 GiB of one card. A four-card host with 5 GiB free on each would clear the
# total and still be unable to load it.
QT_MIN_FREE_PER_CARD_MIB="8000"

# The devices llama-server must offload to, by llama.cpp's own names (see
# `llama-server --list-devices`). NAMING THEM IS WHAT PREVENTS A SILENT CPU
# FALLBACK -- measured on this host 2026-08-24:
#   --device CUDA9           -> "invalid device: CUDA9", exit 1   (hard fail)
#   CUDA_VISIBLE_DEVICES=""  -> "failed to initialize CUDA: no CUDA-capable
#                               device is detected", "Available devices:
#                               (none)", exit 0 -- AND IT SERVES FROM CPU.
# The second is the dangerous one: nothing fails, the node just becomes ~30x
# slower and every client pays for it silently. Naming the devices turns that
# case into the first one. vram-guard.sh covers "no driver"; this covers
# "driver present, CUDA unusable".
QT_DEVICES="CUDA0,CUDA1"
# How many devices must be visible. Guards the half-failure: one card dropping
# off the bus still leaves a working CUDA0, and the 27B would then quietly
# reload onto one card at half the VRAM instead of refusing.
QT_EXPECT_DEVICES="2"

# --- KV cache ----------------------------------------------------------------
# q4_0 for both K and V. KV cost is derived from config.json, never guessed:
#   bytes/token = 2 (K+V) x N_full_attention_layers x kv_heads x head_dim
# Qwen3.5/3.8 are hybrid, so only a minority of layers grow a cache:
#   27B: 16 of 64 full-attention, kv 4, head_dim 256 -> 18.0 KiB/token at q4_0
#    9B:  8 of 32 full-attention, kv 4, head_dim 256 ->  9.0 KiB/token at q4_0
# That is why an 81,920-token pool costs 1.41 GiB for the 27B rather than the
# ~10 GiB a dense model of the same width would want.
QT_KV_TYPE="q4_0"

# --- concurrency -------------------------------------------------------------
# Two seats. A shared pool has NO admission control: over-subscribe it and every
# live session dies together, not just the greedy one, so the tier aliases in
# router-presets.ini are what ration it client-side.
QT_PARALLEL="2"
QT_POOL_TOKENS="81920"

# --- public endpoint ---------------------------------------------------------
# llama.cpp and the dashboard both retreat to loopback; nginx owns the public
# port. The firewall then has ONE port to reason about, and neither backend is
# reachable directly even from inside the LAN.
QT_LLAMA_PORT="8090"

# The authenticating gateway, between nginx and llama.cpp. Loopback only: it is
# reached through nginx, which is the only listener the firewall opens.
QT_GATEWAY_PORT="8082"
QT_PUBLIC_PORT="80"
# :8080 stays served by the same nginx server block so clients configured before
# the move keep working.
QT_COMPAT_PORT="8080"

# A 100k prompt needs ~210 s of prefill before its first token, and a 40k pair
# took 114 s wall clock. nginx's 60 s default would sever exactly the requests
# this node exists to serve, so the timeout is sized from the SLOWEST tier.
QT_PROXY_READ_TIMEOUT="900s"
# A full-context prompt is ~230 KB at 40k tokens and more at 100k.
QT_CLIENT_MAX_BODY="512m"
