; Dual-Turing router presets -- one endpoint, one resident model, two seats.
;
; A section name is a model id a client may ask for. `alias` adds MORE ids that
; resolve to the SAME loaded model, which is how the context tiers work:
; switching between tiers in a client is free, because nothing reloads.
;
; Keys are llama-server long options without the leading dashes ("c" is
; --ctx-size). Verified against the pinned tag in common.conf.
;
; <QT_MODELS_DIR> is substituted at INSTALL time from site.conf. It is a
; placeholder here on purpose: this repository is public and the weights path is
; a property of the site.
;
; ---------------------------------------------------------------------------
; MUST be started with --models-max 1.
;
; The 27B holds 15.33 GiB of the pair's 22.0 GiB. A second resident model would
; OOM several minutes into a load, which reads as a runtime fault rather than a
; configuration mistake. Concurrent sessions must therefore all pick tiers of
; the SAME model: mixing ids across models makes the router swap on every
; request.
;
; KV is DERIVED, not guessed:
;     bytes/token = 2 (K+V) x N_full_attention_layers x kv_heads x head_dim
;   27B: 16 of 64 full-attn, kv 4, head_dim 256 -> 18.0 KiB/token at q4_0
;    9B:  8 of 32 full-attn, kv 4, head_dim 256 ->  9.0 KiB/token at q4_0
; Only a quarter of the 27B's layers grow a cache, which is the whole reason two
; 40k seats are comfortable on 11 GiB cards rather than impossible.
;
; A shared pool has NO admission control. Over-subscribe it and every live
; session dies together -- not just the greedy one. The -40k aliases exist so
; the CLIENT rations the pool: two 40k sessions is exactly one full pool.
; ---------------------------------------------------------------------------

version = 1

[*]
; Shared by every preset; overridable per section.
n-gpu-layers = 999
flash-attn = auto
jinja = true
no-context-shift = true
cache-type-k = q4_0
cache-type-v = q4_0
; One shared pool rather than fixed equal partitions, so a single session may
; use the whole pool when nothing else is running.
kv-unified = true
;
; NOTE: cache-reuse is deliberately ABSENT. The node reports at every load:
;   "cache_reuse is not supported by this context, it will be disabled"
; --cache-reuse reuses chunks across a CHANGED prefix, and this hybrid model's
; Gated-DeltaNet layers hold recurrent state that cannot be partially rewound. An
; option that is silently discarded must not sit here looking effective.
;
; Ordinary prompt prefix caching DOES work and is worth 9x: measured 19.8 s ->
; 2.3 s with 19,425 cached tokens on a repeated 20k prefix. It only lands when the
; request reaches the slot holding that prefix, which is why the 100k tier below
; has its own single-slot preset.
; CROSS-slot reuse stays off. This is the path a previous commit disabled
; because the model child kept dying on it. It is also, unhelpfully, the half a
; two-session fan-out would benefit from most. Do not "improve" this.
slot-prompt-similarity = 0.0

; --- primary: 27B, layer-split across BOTH cards ----------------------------
; 15.33 GiB weights + 1.41 GiB KV (81,920 @ q4_0) + per-card compute buffers and
; CUDA context leaves ~2.9 GiB of 22.0 GiB. Verified at length by
; measure-ceiling.sh before this figure is trusted.
[qwen3.8-27b]
model = <QT_MODELS_DIR>/Qwen3.8-27B-UD-Q4_K_M.gguf
c = 102400
parallel = 2
split-mode = layer
tensor-split = 1,1
alias = qwen3.8-27b-50k,qwen3.8-27b-40k

; --- 100k, ONE slot ---------------------------------------------------------
; One slot is the feature, not a limitation. Prefix caching gives a measured 9x on
; a repeated long prompt, but only when the request lands on the slot holding that
; prefix. With two slots and round-robin assignment -- slot-prompt-similarity
; stays 0.0 because the alternative crashes the model child -- a single sequential
; user hits the cache about half the time. At 100k that alternates ~3.5 minutes and
; ~seconds, which reads as a broken node.
;
; parallel = 1 puts every turn of a session on the same warm slot. The cost is
; that while this preset is resident the node serves ONE session, which is exactly
; what "drop a slot" meant.
[qwen3.8-27b-100k]
model = <QT_MODELS_DIR>/Qwen3.8-27B-UD-Q4_K_M.gguf
c = 102400
parallel = 1
split-mode = layer
tensor-split = 1,1

; --- fast tier: 9B, pinned to ONE card --------------------------------------
; 5.29 GiB weights + 0.70 GiB KV fits a single 11.0 GiB card with ~3.9 GiB spare,
; so it skips split overhead entirely -- tensor-split 1,0 puts every layer on
; device 0. Predicted ~87 tok/s against the 27B's ~30, which is the point of it.
[qwen3.5-9b]
model = <QT_MODELS_DIR>/Qwen3.5-9B-Q4_K_M.gguf
c = 81920
parallel = 2
split-mode = layer
tensor-split = 1,0
alias = qwen3.5-9b-80k,qwen3.5-9b-40k

; --- vision: pool drops to 81,920 to pay for the 881 MiB projector -----------
; Resident ~19,223 MiB of 22,528, leaving ~3,305 free.
;
; Vision is ALWAYS a separate preset, never an option on a text preset. The 24 GiB
; node established why: a projector on the shared preset made every text-only
; session pay ~885 MiB -- roughly 80k tokens of context -- for a capability it
; never used. Dropping the pool here is how the projector gets paid for rather
; than pretended free.
;
; image-min-tokens 1024: a small image adds ~1,026 prompt tokens.
[qwen3.8-27b-vision]
model = <QT_MODELS_DIR>/Qwen3.8-27B-UD-Q4_K_M.gguf
mmproj = <QT_MODELS_DIR>/mmproj-27b-F16.gguf
image-min-tokens = 1024
c = 81920
parallel = 2
split-mode = layer
tensor-split = 1,1
alias = qwen3.8-27b-vision-40k

; --- uncensored -------------------------------------------------------------
; Blackfrost-AI ABLITERATED @ 4f6732ce2123, the artifact the 24 GiB node serves,
; so its quality is characterised rather than assumed. Abliterated builds are
; third-party modifications of the base weights: ordinary model choices for a
; local node, but NOT vendor artifacts.
; 15.66 GiB weights -> resident ~19,040 MiB, ~3,488 free.
[qwen3.8-27b-uncensored]
model = <QT_MODELS_DIR>/Qwen3.8-27B-ABLITERATED-Q4_K_M.gguf
c = 102400
parallel = 2
split-mode = layer
tensor-split = 1,1
alias = qwen3.8-27b-uncensored-50k,qwen3.8-27b-uncensored-40k

; --- uncensored + vision ----------------------------------------------------
; Its projector is Q8_0 at 604 MiB against 881 for F16, which is why this costs
; LESS than the standard vision preset: ~19,284 MiB, ~3,244 free.
[qwen3.8-27b-uncensored-vision]
model = <QT_MODELS_DIR>/Qwen3.8-27B-ABLITERATED-Q4_K_M.gguf
mmproj = <QT_MODELS_DIR>/mmproj-uncensored-Q8_0.gguf
image-min-tokens = 1024
c = 81920
parallel = 2
split-mode = layer
tensor-split = 1,1

; --- 9B vision: still ONE card ----------------------------------------------
; 5.29 GiB weights + 0.855 GiB projector + 0.70 GiB KV fits a single 11.0 GiB card
; with ~3,146 MiB spare, so it keeps tensor-split 1,0 and skips split overhead.
[qwen3.5-9b-vision]
model = <QT_MODELS_DIR>/Qwen3.5-9B-Q4_K_M.gguf
mmproj = <QT_MODELS_DIR>/mmproj-9b-F16.gguf
image-min-tokens = 1024
c = 81920
parallel = 2
split-mode = layer
tensor-split = 1,0
