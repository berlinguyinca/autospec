# Profile: router. The only profile this node runs.
#
# One endpoint, one resident model, two seats. Selecting a different context
# tier in the client is the whole switch -- no control-script call, no port
# change, and for tiers of the same model, no reload either.
#
# shellcheck shell=bash

QT_PROFILE="router"
QT_PROFILE_VERSION="turing-dual-gguf-q4km-router-v1"
QT_RUNTIME="llama.cpp"

QT_ROUTER_PRESETS="${QT_PREFIX}/etc/router-presets.ini"

# ONE. The default is higher and would try to hold two models that together
# exceed the pair's 22 GiB.
QT_ROUTER_MAX_LOADED="1"

# Cross-slot KV reuse stays OFF. Kept here as well as in the presets file so a
# reader changing one of them trips the structural test rather than shipping a
# half-change: check 6 of tests/test_structural.sh asserts this exact value.
QT_SLOT_PROMPT_SIMILARITY="0.0"
