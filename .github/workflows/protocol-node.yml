name: protocol-node

# The @autospec/protocol package — the generated TypeScript declarations
# (packages/protocol/types.d.ts, kept in sync with the v1 JSON Schemas by
# autospec_core::protocol::codegen) and its Node fixture test — ran in no
# workflow: the Rust drift check runs, but the Node side (fixture validation
# against the shared golden fixtures, and the package manifest / tarball
# contract that pi-engineering consumes) only ran locally.
#
# This job runs the package's full node:test suite (fixtures.test.mjs and
# package.test.mjs). The tarball test packs the package and asserts the
# schemas and types ship, so a `files` entry that silently stops matching
# fails the merge path, not just a local run.

on:
  pull_request:
    paths:
      - 'packages/protocol/**'
      - 'schemas/**'
      - '.github/workflows/protocol-node.yml'
  workflow_dispatch:

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run the @autospec/protocol Node suites
        run: |
          set -eu
          cd packages/protocol
          # The whole package's test suite, not a hand-picked file: a new
          # *.test.mjs added to the package must run here without widening
          # this workflow.
          suites="$(find . -maxdepth 1 -name '*.test.mjs' | sort)"
          count="$(printf '%s\n' "$suites" | grep -c .)"
          if [ "$count" -lt 2 ]; then
            echo "expected at least 2 protocol suites, found $count — a suite was" >&2
            echo "renamed, moved, or the glob no longer matches the convention:" >&2
            printf '%s\n' "$suites" >&2
            exit 1
          fi
          echo "$suites"
          # shellcheck disable=SC2086
          node --test $suites
