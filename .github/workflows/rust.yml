name: rust-suites

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: rust-suites-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Clippy (lint)
        run: cargo clippy --workspace --all-targets

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: |
          cargo test -p autospec-core
          cargo test -p autospec-cli --test status_commands --test parent_commands
        # Deterministic, environment-independent subset. The full inline suite
        # (executor_bridge process-supervision, claim heartbeat) requires
        # external tools (codex CLI, gitleaks, semgrep, bubblewrap) and
        # process-shared state that is flaky on a bare GitHub runner; it runs
        # in the local target-repo validation gate instead.

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit
