name: rust-suites

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: rust-suites-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Clippy (lint)
        run: cargo clippy --workspace --all-targets

      - name: Build
        run: cargo build --workspace

      - name: Test
        run: |
          cargo test -p autospec-core --lib
          cargo test -p autospec-cli --bin autospec heartbeat -- --nocapture
          cargo test -p autospec-cli --bin autospec process_owner -- --nocapture
          cargo test -p autospec-cli --bin autospec portability -- --nocapture
          cargo test -p autospec-cli --bin autospec released_predecessor_advances_through_executor_on_supported_host -- --nocapture
        # Deterministic inline unit tests only. Integration tests under
        # tests/*.rs and the executor_bridge inline suite invoke shell
        # scripts / external tools (bash, bats, codex, gitleaks, semgrep,
        # bubblewrap) that are absent or flaky on a bare GitHub runner; the
        # full suite runs in the local target-repo validation gate.

  macos-test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check autospec CLI
        run: cargo check -p autospec-cli

      - name: Test portable autonomous ownership
        run: |
          cargo test -p autospec-cli --bin autospec heartbeat -- --nocapture
          cargo test -p autospec-cli --bin autospec process_owner -- --nocapture
          cargo test -p autospec-cli --bin autospec portability -- --nocapture
          admission_test='commands::autonomous::executor_bridge::portability::supported_host_tests::supported_host_retires_predecessor_runs_noop_and_publishes_terminal_receipt'
          admission_output="$(cargo test -p autospec-cli --bin autospec "$admission_test" -- --exact --nocapture 2>&1)"
          printf '%s\n' "$admission_output"
          test "$(printf '%s\n' "$admission_output" | grep -F -c "test $admission_test ... ok")" -eq 1

      - name: Build release autospec CLI
        run: cargo build --release -p autospec-cli

  windows-test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check autospec CLI and tests
        run: cargo check -p autospec-cli --tests --target x86_64-pc-windows-msvc

      - name: Test portable autonomous ownership
        shell: pwsh
        run: |
          cargo test -p autospec-cli --bin autospec heartbeat -- --nocapture
          cargo test -p autospec-cli --bin autospec process_owner -- --nocapture
          cargo test -p autospec-cli --bin autospec portability -- --nocapture
          $admissionTest = 'commands::autonomous::executor_bridge::portability::supported_host_tests::supported_host_retires_predecessor_runs_noop_and_publishes_terminal_receipt'
          $admissionOutput = cargo test -p autospec-cli --bin autospec $admissionTest -- --exact --nocapture 2>&1 | Out-String
          $admissionExit = $LASTEXITCODE
          Write-Output $admissionOutput
          if ($admissionExit -ne 0) { exit $admissionExit }
          if ([regex]::Matches($admissionOutput, [regex]::Escape("test $admissionTest ... ok")).Count -ne 1) { throw 'portable admission test did not pass exactly once' }

      - name: Build release autospec CLI
        run: cargo build --release -p autospec-cli

  freebsd-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Test autospec CLI inside FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y curl git
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          run: |
            set -eu
            . "$HOME/.cargo/env"
            cargo check -p autospec-cli
            cargo test -p autospec-cli --bin autospec heartbeat -- --nocapture
            cargo test -p autospec-cli --bin autospec process_owner -- --nocapture
            cargo test -p autospec-cli --bin autospec portability -- --nocapture
            admission_test='commands::autonomous::executor_bridge::portability::supported_host_tests::supported_host_retires_predecessor_runs_noop_and_publishes_terminal_receipt'
            admission_output="$(cargo test -p autospec-cli --bin autospec "$admission_test" -- --exact --nocapture 2>&1)"
            printf '%s\n' "$admission_output"
            test "$(printf '%s\n' "$admission_output" | grep -F -c "test $admission_test ... ok")" -eq 1
            cargo build --release -p autospec-cli

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit
