name: rust-suites

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: rust-suites-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Bootstrap repository test tools
        run: bash scripts/dev-bootstrap.sh

      - name: Clippy (lint)
        run: cargo clippy --workspace --all-targets

      - name: Test Linux ownership contracts
        run: |
          cargo test -p autospec-cli --bin autospec pidfd -- --nocapture
          cargo test -p autospec-cli --bin autospec subreaper -- --nocapture
          cargo test -p autospec-cli --bin autospec heartbeat_startup -- --nocapture
          cargo test -p autospec-cli --test claim_commands stale_startup_recovery -- --nocapture
          cargo test -p autospec-cli --bin autospec cleanup_restart -- --nocapture

      - name: Test workspace
        run: cargo test --workspace

      - name: Validate repository
        run: cargo run -p autospec-cli -- validate

      - name: Build
        run: cargo build --workspace

  macos-build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check autospec CLI
        run: cargo check -p autospec-cli

      - name: Test Darwin ownership contracts
        run: |
          cargo test -p autospec-cli platform_process -- --nocapture
          cargo test -p autospec-cli heartbeat_startup -- --nocapture
          cargo test -p autospec-cli harness_supervisor -- --nocapture
          cargo test -p autospec-cli adoption_cleanup -- --nocapture

      - name: Build release autospec CLI
        run: cargo build --release -p autospec-cli

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit
