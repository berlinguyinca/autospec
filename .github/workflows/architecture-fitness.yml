name: architecture-fitness

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  architecture-fitness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run architecture fitness gates
        run: bash scripts/architecture-fitness.sh run --registry .autospec/architecture-fitness.yml
