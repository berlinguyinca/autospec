# examples/model-profiles.yml
#
# Sample model-profiles file consumed by `/autospec-run --profile <name>`.
# Spec reference: docs/specs/2026-05-01-autospec-meta-improvements-design.md §4.3
#
# Schema (per profile entry):
#   <profile-name>:
#     model:      Model identifier the harness should resolve at dispatch time.
#     ctx:        Context-window budget (tokens) the profile is rated for.
#     reasoning:  Reasoning tier hint — one of `low`, `medium`, `high`.
#     allowed:    Comma-separated list of issue labels this profile may pick up.
#                 The Phase 4 dispatcher filters auto-implement issues by these
#                 labels before scheduling work onto the profile.
#
# Two reference profiles are shipped: a cloud Claude Sonnet target with a
# generous context window, and a 32B-class local Qwen target sized for a
# laptop.  The laptop profile intentionally restricts itself to small-context
# / low-reasoning issues so it never gets handed a job it cannot complete.

claude-sonnet-cloud:
  model: claude-sonnet-4-6
  ctx: 200000
  reasoning: medium
  allowed: ctx:small,ctx:medium,reasoning:low,reasoning:medium

qwen3-32b-laptop:
  model: qwen3-32b-instruct
  ctx: 32000
  reasoning: low
  allowed: ctx:small,reasoning:low

# Phase 2 Haiku trial — cost-optimised tier for shallow/medium-reasoning implementer dispatches.
# LGTM-first-pass rate and iteration count tracked in telemetry to gate rollback.
# Rollback: set AUTOSPEC_TIER_B_PROFILE=claude-sonnet-cloud in ~/.autospec/env to revert.
claude-haiku-cloud:
  model: claude-haiku-4-5
  ctx: 64000
  reasoning: medium
  allowed: ctx:small,ctx:medium,reasoning:shallow,reasoning:medium

# ── Advisor pattern (docs/specs/2026-07-08-autospec-advisor-pattern-design.md) ──
# On-demand strong-model escalation for cheap-tier executors. A cheap executor
# runs the loop and escalates bounded hard decisions to a harness-native TIER_A
# advisor (advice-only). Off by default. The `impl-haiku` gate is promoted first
# and alone; add the others only after advisor-report.sh shows promote=true
# (observed LGTM-first-pass >= baseline AND net cost/issue <= sonnet-solo).
#   AUTOSPEC_ADVISOR=on              enable the layer (default: off)
#   AUTOSPEC_ADVISOR_GATES=...       comma list of enabled gates
#                                    (default: impl-haiku; others: reviewer, retry, impl-decision)
#   AUTOSPEC_ADVISOR_MAX_USES=3      per-issue cap, shared across all gates
#   AUTOSPEC_ADVISOR_MAX_CHARS=2800  guidance budget (~700 tokens)
# Rollback: AUTOSPEC_ADVISOR=off, or drop a gate from AUTOSPEC_ADVISOR_GATES.
