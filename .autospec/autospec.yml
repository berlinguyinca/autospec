version: 1
generated_by: autospec-sweep
config_path: .autospec/autospec.yml
git:
  tracked: true
  commit_required: true
project:
  profile: 'full'
  team_personality: 'auto'
  findings:
    stack:
      - 'bash'
      - 'bats'
      - 'node'
      - 'github-cli'
      - 'multi-harness-skill'
    commands:
      test: 'autospec validate && bats tests/unit tests/smoke'
      e2e: 'GH_CONFIG_DIR="$(mktemp -d)" E2E=0 AUTOSPEC_RUN_LIVE_COORDINATION_E2E=0 bats tests/e2e'
      deploy: 'true'
  questions:
    - 'Should live GitHub E2E sweeps create throwaway repos during scheduled runs, or stay skipped under strict isolation?'
steps:
  define:
    enabled: true
  classify:
    enabled: true
  run:
    enabled: true
  review:
    enabled: true
  test:
    enabled: true
  clone:
    enabled: true
  sweep:
    enabled: true
sweep:
  cadence: end_of_run
  profile: 'full'
  spec_sync:
    enabled: true
    mode: reality_check
    update_specs_before_code: true
    create_gap_issues: true
  competitor_research:
    enabled: false
    sources: []
  improvement_budget:
    max_issues_per_sweep: 5
    prefer_small_reviewable_changes: true
continuous_improvement:
  docs:
    enabled: true
    checks: [doc_drift, user_manual, api_reference, runbooks]
  tests:
    enabled: true
    checks: [coverage_gaps, e2e_surface_gaps, regression_gaps]
  code:
    enabled: true
    checks: [complexity, duplication, dead_code, security_footguns]
  loop:
    create_or_update_specs: true
    file_issues: true
    route_fixes_via_autospec_run: true
autonomous:
  repo_dir: auto
  repo: auto
  heartbeat_dir: auto
  concurrency:
    batch_size: auto
    max_concurrent_repo_workers: auto
  claims:
    lease_seconds: 10800
    settle_seconds: 0.2
    confirm_reads: 5
  watchdog:
    heartbeat_dir: auto
    repo: auto
    stale_secs: 1800
    reclaim_secs: 10800
    claimed_timeout_secs: 1800
    nudge_cooldown_secs: 900
    state_file: auto
    gc_dir: /tmp
    gc_heartbeat_fresh_secs: 1800
  drain:
    stall_secs: 1800
    poll_secs: 15
# Advisor pattern: a cheap Phase 4 executor escalates bounded hard decisions to a
# harness-native TIER_A advisor (advice-only). You set intent + bounds; autospec
# self-governs which gates are active. policy: auto | on | off.
#   auto — autospec promotes/retracts gates from its own telemetry (sweep loop),
#          seeded at the low-risk impl-haiku gate, within budget.
#   on   — all gates active within budget (no self-tuning).
#   off  — inert.
advisor:
  policy: auto
  budget:
    max_calls_per_issue: 3
    guidance_char_cap: 2800
# Backlog auto-grooming: promotes/templates/splits stale or malformed open issues
# toward auto-implement readiness, gated by the same safety/classify/eligibility
# checks as manual triage. You set intent + bounds; autospec self-governs which
# grooming actions are active. policy: auto | on | off.
#   auto — autospec promotes/retracts grooming actions from its own telemetry,
#          seeded conservatively, within budget.
#   on   — grooming runs every Tier-1.5 cycle within budget (no self-tuning).
#   off  — inert.
grooming:
  policy: auto
  budget:
    max_issues_per_cycle: 5
    groom_attempts_per_issue: 2
    canary_floor: 5
documentation:
  enabled: true
  audiences:
    - id: users
      label: End users
      # gen-audience-docs.mjs validates { name, path } and renders `name` as the
      # document heading; `id`/`label` are the config-side vocabulary that other
      # readers use. Mirroring label into name keeps both contracts satisfied
      # rather than renaming a key whose other consumers are unknown.
      name: End users
      path: docs/USER_MANUAL.md
      focus: Installation, daily workflows, troubleshooting, and success criteria.
      require_scope: true
    - id: developers
      label: Developers
      name: Developers
      path: docs/API_REFERENCE.md
      focus: CLI, helper scripts, config schema, and extension points.
      require_scope: true
    - id: operators
      label: Operators
      name: Operators
      path: docs/runbooks/OPERATIONS.md
      focus: Deployment, monitoring, recovery, scheduling, and safe rollback.
      require_scope: true
    - id: security-reviewers
      label: Security reviewers
      name: Security reviewers
      path: docs/SECURITY.md
      focus: Trust boundaries, secret handling, production access, and abuse cases.
      require_scope: true
  scopes:
    - id: repository-overview
      label: Repository overview
      path: README.md
      focus: What autospec does, which skill to use, and the supported workflow.
      require_scope: false
    - id: user-workflows
      label: User workflows
      path: docs/USER_MANUAL.md
      focus: Invocation flows, setup, stop/resume, sweep, review, and run behavior.
      require_scope: true
    - id: api-reference
      label: API and script reference
      path: docs/API_REFERENCE.md
      focus: Installed helper scripts, config fields, command flags, and exit codes.
      require_scope: true
    - id: operations-runbooks
      label: Operations runbooks
      path: docs/runbooks/OPERATIONS.md
      focus: Daemon operation, concurrency, CI waiting, quota recovery, and incident response.
      require_scope: true
    - id: troubleshooting
      label: Troubleshooting
      path: docs/TROUBLESHOOTING.md
      focus: Common failures, diagnostics, recovery commands, and escalation paths.
      require_scope: true
execution:
  tests:
    run_all_every_sweep: true
    fail_sweep_on_test_failure: true
  deployment:
    deploy_if_tests_require: true
    required_for: [e2e]
safety:
  production_access: 'strict_isolation'
  secrets_policy: references_only
  never_clone_raw_secrets: true
  issue_intent_gate:
    enabled: true
    default_decision: quarantine_uncertain
    require_pass_marker_for_run: true
    quarantine_labels:
      - security:quarantined
    remove_labels_on_quarantine:
      - auto-implement
      - needs-classify
    block_patterns:
      - id: production-data-destruction
        severity: block
        patterns:
          - "(?i)delete .*production"
          - "(?i)drop .*prod(uction)? .*database"
      - id: secret-exfiltration
        severity: block
        patterns:
          - "(?i)(dump|print|exfiltrate|send).*secret"
          - "(?i)(aws|github|stripe).*token"
      - id: instruction-bypass
        severity: block
        patterns:
          - "(?i)ignore (all )?(previous|system|developer|agent) instructions"
          - "(?i)bypass (ci|tests|hooks|review|guardian)"
      - id: destructive-shell
        severity: block
        patterns:
          - "rm -rf /"
          - "(?i)curl .*\\| *(sh|bash)"
    ambiguous_patterns:
      - id: vague-data-cleanup
        severity: ambiguous
        patterns:
          - "(?i)clean (old|bad|stale)? ?data"
      - id: weaken-security-control
        severity: ambiguous
        patterns:
          - "(?i)(relax|disable|remove).*security"
          - "(?i)(relax|disable|remove).*(auth|audit|logging)"
      - id: production-or-infra-touch
        severity: ambiguous
        patterns:
          - "(?i)\\b(production|prod|billing|payments|migration|terraform|iam|kms)\\b"
    semantic_review:
      enabled: true
      trigger_on:
        - deterministic_ambiguous
        - risky_keyword
        - auth_or_secrets
        - production_or_infra
    trusted_actors:
      - login: berlinguyinca
        trust: repo_owner
        allowed_risk:
          - test_data_reset
          - fixture_regeneration
          - local_dev_cleanup
          - documented_migration_replay
    trusted_actor_rules:
      require_scope_match: true
      never_bypass:
        - secret_exfiltration
        - credential_printing
        - auth_backdoor
        - production_data_destruction
        - instruction_bypass
        - ci_or_review_bypass
compatibility:
  legacy_skill_contracts: read_if_present
  source_of_truth: .autospec/autospec.yml

# Config-driven blast-radius quarantine registry. Any changed path matching one
# of these surfaces is routed to async human review instead of auto-merge.
fenced_surfaces:
  - id: schema-migrations
    severity: high
    reason: Schema migrations and contracts can break persisted data.
    paths:
      - "schemas/**"
      - "migrations/**"
      - "db/migrations/**"
      - "**/*migration*"
  - id: auth-secrets
    severity: high
    reason: Auth, token, and secret-handling paths carry security blast radius.
    paths:
      - "**/*auth*"
      - "**/*secret*"
      - "**/*token*"
      - ".github/workflows/**"
  - id: public-api-contracts
    severity: high
    reason: Public API and package/crate contracts affect downstream users.
    paths:
      - "packages/**"
      - "crates/**"
      - Cargo.toml
      - Cargo.lock
  - id: autonomous-control-plane
    severity: fenced
    reason: Autonomous conductor and guardrail code controls merge behavior.
    paths:
      - scripts/autospec-autonomous.sh
      - scripts/autospec-autonomous-run-drain.sh
      - scripts/autonomous-*.sh
      - scripts/worktree-guard.sh
      - scripts/claim-guard.sh
      - scripts/autospec-autonomy-gate.sh
  - id: autospec-policy-config
    severity: fenced
    reason: AutoSpec policy config edits can change autonomous safety policy.
    paths:
      - ".autospec/**"
telemetry:
  # The ONLY operator-facing flag surface for autospec-db telemetry
  # (spec: docs/specs/2026-07-10-autospec-db-telemetry-design.md §Configuration).
  # Env vars are yaml-derived plumbing / CI-test overrides only. Credentials
  # live in chmod-600 ~/.autospec/db.conf + db.env — never here.
  enabled: true              # false => loader exports AUTOSPEC_DB_DISABLE=1
  host_label: ''             # '' = short hostname; set per-site labels via env override until #1776 resolves machine scoping
  spool_max_bytes: 10485760  # local spool cap; oldest lines dropped first
  install:
    db_module: prompt        # prompt | always | never — install.sh behavior for the optional autospec-db module
