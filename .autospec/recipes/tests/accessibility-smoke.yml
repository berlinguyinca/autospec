id: accessibility-smoke
title: Accessibility smoke test
summary: Accessibility smoke test
category: tests
applies_to_rules:
  - required_accessibility_checklist
  - required_playwright_accessibility_flow
applies_to_capabilities:
  - playwright_scaffold
repo_conditions:
  application_types:
    - web
    - cli
  technologies:
    - playwright
  required_files:
    []
  optional_files:
    []
risk:
  level: low
  requires_human_guidance: false
  requires_architecture_review: false
implementation:
  mode: test
  allowed_paths:
    - docs/**
    - .autospec/**
    - tests/**
    - src/**
  forbidden_paths:
    - .github/workflows/**
    - .env
    - .env.*
    - **/migrations/**
    - package.json
    - pyproject.toml
  max_files_changed: 5
  max_lines_changed: 250
  expected_files:
    create:
      - tests/e2e/autospec-accessibility.spec.ts
    update:
      []
    inspect:
      []
test_plan:
  required: true
  suggested_commands:
    - bash scripts/autospec-rule-recheck.sh --dry-run
  generated_tests:
    - tests/e2e/autospec-accessibility.spec.ts
validation:
  commands:
    - bash scripts/autospec-rule-recheck.sh --dry-run
  required_evidence:
    - report
docs:
  update:
    - docs/specs
metadata:
  update:
    - .autospec/state
acceptance_criteria:
  - Accessibility smoke test scaffold/spec exists.
  - Rule recheck is honest about before/after status.
stuck_if:
  - stack confidence is low
  - capability is disabled
  - forbidden path required
