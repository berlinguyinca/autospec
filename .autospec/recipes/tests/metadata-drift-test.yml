id: "metadata-drift-test"
title: "Metadata drift test"
summary: "Metadata drift test"
category: "tests"
applies_to_rules:
  - "required_docs_drift_check"
applies_to_capabilities:
  - "tests"
repo_conditions:
  application_types:
    - "web"
    - "cli"
  technologies:
    []
  required_files:
    []
  optional_files:
    []
risk:
  level: "low"
  requires_human_guidance: false
  requires_architecture_review: false
implementation:
  mode: "test"
  allowed_paths:
    - "docs/**"
    - ".autospec/**"
    - "tests/**"
    - "src/**"
  forbidden_paths:
    - ".github/workflows/**"
    - ".env"
    - ".env.*"
    - "**/migrations/**"
    - "package.json"
    - "pyproject.toml"
  max_files_changed: 5
  max_lines_changed: 250
  expected_files:
    create:
      - "tests/unit/autospec-metadata-drift.bats"
    update:
      []
    inspect:
      []
test_plan:
  required: true
  suggested_commands:
    - "bash scripts/autospec-rule-recheck.sh --dry-run"
  generated_tests:
    - "tests/unit/autospec-metadata-drift.bats"
validation:
  commands:
    - "bash scripts/autospec-rule-recheck.sh --dry-run"
  required_evidence:
    - "report"
docs:
  update:
    - "docs/specs"
metadata:
  update:
    - ".autospec/state"
acceptance_criteria:
  - "Metadata drift test scaffold/spec exists."
  - "Rule recheck is honest about before/after status."
stuck_if:
  - "stack confidence is low"
  - "capability is disabled"
  - "forbidden path required"
