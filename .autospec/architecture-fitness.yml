# Declarative architecture fitness-function registry.
# Each entry is runnable by scripts/architecture-fitness.sh and can act as a CI gate.
fitness_functions:
  # Money here is integer by deliberate convention -- cost_per_1k_millicents
  # (initiative/routing.rs, commented "integer to keep money off floats") and
  # cost_per_1k_prompt_micros (aar/profile.rs). Neither lives in a money-named file,
  # so scoping this gate by file name -- the convention its own scripts/**/*money*
  # arm uses -- would not have covered them. Scoping it by bare f64 over
  # crates/**/*.rs, as it was first authored, covered far too much: it counted 100
  # non-monetary values (capability scores, cache-hit ratios, tokens-per-second,
  # median wall-clock ms, docker memory parsing) and so the gate never once passed
  # on main. The pattern is therefore what carries the scope -- it matches f64 only
  # where it is bound to a money-denominated identifier, which still catches the
  # realistic regression of retyping or casting a millicents/micros value.
  # "quantity", named in the original description, is deliberately dropped: it is
  # too generic to mean money in a repo with no financial domain.
  - id: financial_no_f64
    name: Money-denominated values stay off binary floating point
    description: 'A money-denominated identifier must never be typed f64. Non-monetary f64 -- scores, ratios, throughput, durations -- is allowed.'
    type: forbidden_pattern
    gate: true
    threshold: 0
    paths:
      - crates/**/*.rs
      - scripts/**/*money*
      - scripts/**/*price*
      - scripts/**/*pnl*
    pattern: '(?i)\b(?:[a-z0-9]+_)*(price|pnl|money|invoice|payment|revenue|billing|balance|fee|spend|budget|amount|millicents|micros|cents|usd|dollars)[a-z0-9_]*\s*(:|\([^)]*\)\s*->|\s+as)\s*(Option\s*<\s*)?f64'
    metric: forbidden_f64_occurrences
    issue:
      title: 'fix: type a money-denominated value off f64'
      labels: ['auto-implement', 'architecture-fitness']

  - id: shell_no_destructive_git
    name: Shell scripts avoid destructive git operations
    description: Automation must not hard-reset or force-push from repository scripts.
    type: forbidden_pattern
    gate: true
    threshold: 0
    paths:
      - scripts/**/*.sh
      - skills/**/scripts/**/*.sh
    exclude_paths:
      - scripts/lint-implementation.sh
      - scripts/autospec-autonomy-gate.sh
    pattern: 'git (reset --hard|push --force)'
    metric: destructive_git_occurrences
    issue:
      title: 'fix: remove destructive git operation from automation'
      labels: ['auto-implement', 'architecture-fitness']

  - id: rust_core_cli_direction
    name: Rust CLI depends inward on core only
    description: Tier-0 Rust crates keep the CLI depending on core, never core on CLI.
    type: forbidden_pattern
    gate: true
    threshold: 0
    paths:
      - crates/autospec-core/src/**/*.rs
      - crates/autospec-core/Cargo.toml
    pattern: 'autospec[-_]cli'
    # Fixture path strings inside #[cfg(test)] modules are not a dependency, and they
    # reddened this gate twice (#3665, #3696) with no layering violation behind it. Test
    # modules are excluded; production source, comments included, still counts, and the
    # Cargo.toml arm of `paths` is unaffected because the skip is .rs-only.
    skip_cfg_test: true
    metric: core_to_cli_dependency_occurrences
    issue:
      title: 'fix: restore Rust core dependency direction'
      labels: ['auto-implement', 'architecture-fitness']

  - id: async_safety_no_await_holding_lock
    name: Async safety lint stays enabled
    description: CI must preserve clippy await_holding_lock coverage when clippy config is present.
    type: forbidden_pattern
    gate: true
    threshold: 0
    paths:
      - crates/**/*.rs
      - scripts/**/*.sh
    pattern: 'allow\([^)]*await_holding_lock'
    metric: await_holding_lock_allowances
    issue:
      title: 'fix: remove await_holding_lock allowance'
      labels: ['auto-implement', 'architecture-fitness']

  - id: latency_budget_validate_fast
    name: Fitness engine fast path stays below 50ms
    description: The engine's local no-op benchmark must remain under the fast-path budget.
    type: command_max_ms
    gate: true
    threshold: 50
    command: '/usr/bin/true'
    metric: elapsed_ms
    issue:
      title: 'fix: restore architecture fitness fast-path latency budget'
      labels: ['auto-implement', 'architecture-fitness']
