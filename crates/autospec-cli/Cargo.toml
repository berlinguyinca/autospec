[package]
name = "autospec-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "autospec"
path = "src/main.rs"

[dependencies]
autospec-core = { path = "../autospec-core" }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["fs", "process", "signal"] } # why: safe PID probes and descriptor-relative runtime-state operations

[dev-dependencies]
serde_json = "1" # why: parse runtime command JSON in tests instead of substring matching
