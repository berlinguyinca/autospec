[package]
name = "autospec-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "autospec"
path = "src/main.rs"

[dependencies]
autospec-core = { path = "../autospec-core" }
serde_json = "=1.0.150" # why: compare durable heartbeat identities before accepting an existing session binding
yaml-edit = "=0.2.3" # why: reject malformed explicit safety-policy YAML instead of defaulting open

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["fs", "process", "signal", "user"] } # why: safe openat2, euid, PID, and descriptor-relative state operations
