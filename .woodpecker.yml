# Woodpecker CI (ci.metabolomics.us) -- the autospec gate.
#
# This replaces seven separate TeamCity build configurations, each of which
# published its own commit status onto every pull request:
#
#   Autospec_AccessibilityWorkstream  Autospec_ArchitectureFitness
#   Autospec_FileSizeRatchet          Autospec_PythonSuites
#   Autospec_SecurityWorkstream       Autospec_StackGuard
#   Autospec_UxUiWorkstream
#
# They are steps of one pipeline here, so the repository has ONE check.
# The step logic is in ops/ci/woodpecker-gates.sh, in this repository, so a
# gate changes in the same commit as the code it covers and so the whole run
# is reproducible by hand: `bash ops/ci/woodpecker-gates.sh`.
#
# An exec host is a Slurm job on a Rocky 9 node, but the agent execs itself
# into an Apptainer image (woodpecker/images/ci.sif) and runs steps as child
# processes, so:
#
#  * `image:` is a HOST executable, not a container image: `bash` runs the
#    job's own shell. There is no docker, no apt and no sudo.
#  * A step sees Debian 13 (trixie) with python3 3.13.5, git, jq, node,
#    cargo and (since the image rebuild of 2026-09-22) shellcheck 0.10.0.
#    It does NOT see gh or python3.12. Two gates are affected; both say so
#    at the point of use and in the PR that added this.
#  * Nothing here runs shellcheck. None of the seven TeamCity configurations
#    did -- the two that lint shell run `bash -n` and nothing more -- so
#    adding it would be a NEW gate arriving under cover of a migration, and
#    a repo with 400+ tracked shell scripts deserves that as its own change
#    with its own severity floor. The tool is available when someone wants
#    to make that call.
#  * The clone plugin fails invisibly on this backend (no step logs for
#    plugins), so skip_clone + a plain git checkout step, with the forge
#    credential staged at /etc/woodpecker-git-credentials.
#  * The agent reproducibly drops a step's final log chunk, so the gate
#    script prints its journal path FIRST and tees everything to it.

# Pull requests, and pushes to the default branch only.
#
# Woodpecker runs the push and the pull_request pipeline for the same commit
# concurrently, on whatever agents are free. Two full gate runs sharing one
# repository's Slurm capacity is contention for no added coverage -- the same
# SHA can then pass on one and time out on the other, which reads as flake.
# Every TeamCity config here was PR-driven (the pullRequests build feature);
# only architecture-fitness, python-suites and security-workstream also ran
# on main, and the push rule below keeps that.
#
# The branch is the literal `main`, not a CI_REPO_DEFAULT_BRANCH reference. A
# `when` clause is evaluated when the pipeline is MATCHED, before any step
# environment exists; an unsubstituted variable there compares against its own
# text, matches nothing, and the rule is silently dead. A literal that is wrong
# the day the default branch is renamed is at least visible in this file.
when:
  - event: [pull_request, manual]
  - event: push
    branch: main

skip_clone: true

steps:
  - name: checkout
    image: bash
    commands:
      - 'set -eu'
      - 'test -r /etc/woodpecker-git-credentials || { echo "the job staged no forge credential" >&2; exit 1; }'
      - 'git init -q -b "${CI_COMMIT_BRANCH:-main}" .'
      - 'git remote add origin "https://github.com/${CI_REPO}.git"'
      # NOT --depth=1, unlike the inferweave-slurm reference this is copied
      # from. Three gates here (file-size-ratchet, stack-guard, and
      # security-workstream in PR mode) compute `git merge-base origin/<base>
      # HEAD`, and a shallow fetch of a single sha shares no history with the
      # base branch: merge-base finds nothing and the gate dies unreadably.
      - 'git fetch --no-tags origin "$CI_COMMIT_SHA"'
      - 'git checkout -q FETCH_HEAD'
      # The base branch, by an EXPLICIT refspec.
      #
      # `git fetch origin main` writes FETCH_HEAD and updates
      # refs/remotes/origin/main only opportunistically, through the remote's
      # configured refspec -- which an `init` + `remote add` checkout does not
      # have. The retired .github/workflows/security-workstream.yml carried
      # this same note: without the refspec, origin/main never exists and
      # every PR scan died on `merge-base origin/main HEAD`.
      #
      # Not shallow either: merge-base needs the history the two refs share.
      #
      # Write `$target` unbraced, never the dollar-brace form.
      #
      # Woodpecker expands a dollar-brace reference against the PIPELINE's own
      # variables before the shell ever sees the command. `target` is a shell
      # variable set on the line below, so Woodpecker does not know it, expands
      # it to nothing, and hands the shell `+refs/heads/:refs/remotes/origin/`.
      # Pipeline 1 of this repo died exactly that way, and the only clue in the
      # log was a branch name that had silently vanished. An unbraced `$target`
      # is not expansion syntax and reaches the shell intact.
      #
      # The same expansion runs over the RAW YAML, comments included -- so a
      # dollar-brace containing anything that is not a variable name fails the
      # whole pipeline with "unable to parse variable name" and no line number.
      # That is how pipeline 2 died, on a comment explaining pipeline 1.
      - 'target="${CI_COMMIT_TARGET_BRANCH:-$CI_REPO_DEFAULT_BRANCH}"'
      # An empty base is a bug in this step, not a branch named "". Say so
      # here rather than letting git report an invalid refspec.
      - 'test -n "$target" || { echo "no base branch: CI_COMMIT_TARGET_BRANCH and CI_REPO_DEFAULT_BRANCH are both empty" >&2; exit 1; }'
      - 'echo "base branch: $target"'
      - 'git fetch --no-tags origin "+refs/heads/$target:refs/remotes/origin/$target"'
      - 'git --no-pager log --oneline -1'

  # The six gates below are independent of each other and depend only on the
  # checkout, so they are declared as a fan-out rather than a chain: a red
  # gate no longer hides the result of the five behind it, which is what the
  # seven separate TeamCity configurations got right and a naive single
  # sequence would lose.
  - name: accessibility-workstream
    image: bash
    depends_on: [checkout]
    commands:
      - 'bash ops/ci/woodpecker-gates.sh accessibility'

  - name: ux-ui-workstream
    image: bash
    depends_on: [checkout]
    commands:
      - 'bash ops/ci/woodpecker-gates.sh ux-ui-workstream'

  - name: file-size-ratchet
    image: bash
    depends_on: [checkout]
    environment:
      # TeamCity carried these as build parameters on Autospec_FileSizeRatchet.
      MAX_LOC: "600"
      HARD_LOC: "2000"
    commands:
      - 'bash ops/ci/woodpecker-gates.sh file-size-ratchet'

  - name: stack-guard
    image: bash
    depends_on: [checkout]
    environment:
      # Advisory, as on Autospec_StackGuard. Set to "1" to make findings block.
      AUTOSPEC_PR_SIZE_STRICT: "0"
    commands:
      - 'bash ops/ci/woodpecker-gates.sh stack-guard'

  - name: python-suites
    image: bash
    depends_on: [checkout]
    commands:
      - 'bash ops/ci/woodpecker-gates.sh python-suites'

  - name: security-workstream
    image: bash
    depends_on: [checkout]
    commands:
      - 'bash ops/ci/woodpecker-gates.sh security-workstream'

  # ── The GitHub Actions `build-test` job ──────────────────────────────────
  #
  # The eight steps below are NOT from TeamCity. They reproduce `build-test`
  # in .github/workflows/rust.yml, which is the check main's branch
  # protection requires and whose last GitHub run was 2026-09-17. Everything
  # above this comment could be green and a pull request still could not
  # merge, because that one required check was neither passing nor being
  # produced any more.
  #
  # A CHAIN, not a fan-out, unlike the six gates above. They all share one
  # cargo target directory, so running them concurrently would only make them
  # queue on cargo's build lock -- with the wait hidden inside a step instead
  # of shown in the pipeline. Chained, each step's duration is its own.
  #
  # Split by GitHub step name rather than run as one, for the reason the job's
  # own --no-fail-fast comment gives: when clippy, the tests, catalog parity,
  # validate and build are one step, a single long-standing failure hides all
  # of them -- on main, `Validate repository` and `Build` had not executed in
  # CI for as long as one test had been failing. Here a red `rust-workspace-
  # test` still leaves the four behind it to report for themselves.
  #
  # semgrep is NOT installed: `build-test` pins it as a docker image digest
  # and there is no docker in this image. See gate_rust_tools in
  # ops/ci/woodpecker-rust-gates.sh for what was rejected and why, and the PR
  # that added these steps for what it costs.
  - name: rust-tools
    image: bash
    depends_on: [checkout]
    commands:
      - 'bash ops/ci/woodpecker-gates.sh rust-tools'

  - name: rust-clippy
    image: bash
    depends_on: [rust-tools]
    commands:
      - 'bash ops/ci/woodpecker-gates.sh rust-clippy'

  - name: rust-ownership-contracts
    image: bash
    depends_on: [rust-clippy]
    commands:
      - 'bash ops/ci/woodpecker-gates.sh rust-ownership-contracts'

  - name: rust-catalog-parity
    image: bash
    depends_on: [rust-ownership-contracts]
    commands:
      - 'bash ops/ci/woodpecker-gates.sh rust-catalog-parity'

  - name: rust-build
    image: bash
    depends_on: [rust-catalog-parity]
    commands:
      - 'bash ops/ci/woodpecker-gates.sh rust-build'

  - name: rust-behaviour-probes
    image: bash
    depends_on: [rust-build]
    commands:
      - 'bash ops/ci/woodpecker-gates.sh rust-behaviour-probes'

  # The two long gates are SIBLINGS, and last.
  #
  # build-test runs the workspace suite fourth and `Validate repository`
  # seventh, which means on GitHub a red suite stops validate and build from
  # running at all -- they had not executed in CI for as long as one test had
  # been failing, which is the job's own --no-fail-fast complaint one level
  # up. Here the six cheap gates run first and these two run in parallel at
  # the end, so a red one never costs the report of the other. Nothing is
  # reordered WITHIN either.
  #
  # Parallel is safe despite the shared target directory: everything they
  # need is already compiled by rust-build and rust-ownership-contracts, so
  # neither does real codegen and cargo's build lock is taken briefly.
  - name: rust-validate
    image: bash
    depends_on: [rust-behaviour-probes]
    commands:
      - 'bash ops/ci/woodpecker-gates.sh rust-validate'

  - name: rust-workspace-test
    image: bash
    depends_on: [rust-behaviour-probes]
    commands:
      - 'bash ops/ci/woodpecker-gates.sh rust-workspace-test'
