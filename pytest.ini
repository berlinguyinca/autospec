[pytest]
# importlib, because two test files may share a basename.
#
# Under the default "prepend" import mode pytest derives a module name from the
# file's basename, so tests/routing-foundation/test_schemas.py and
# tests/pi-agent-handoff/test_schemas.py collide and collection fails with an
# import error naming neither of them clearly. The usual fix -- an __init__.py
# making each directory a package -- is unavailable here: both directory names
# contain hyphens, which are not valid in a Python package name.
#
# Each suite passed on its own and failed only when collected together, which is
# the shape of bug that reaches CI rather than a developer's terminal. Verified:
# 262 tests pass under this mode across packages and tests.
addopts = --import-mode=importlib
