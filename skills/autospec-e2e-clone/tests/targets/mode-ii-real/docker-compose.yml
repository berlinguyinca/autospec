services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: clonedb
      POSTGRES_USER: cloneuser
      POSTGRES_PASSWORD: clonepass
    ports:
      - "25432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloneuser -d clonedb"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "29000:9000"
      - "29001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 5s
      retries: 10
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/clone-assets &&
        echo 'mode-ii fixture object' | mc pipe local/clone-assets/seed/object1.txt
      "

  app:
    image: nginx:alpine
    ports:
      - "28080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 2s
      timeout: 3s
      retries: 15
    depends_on:
      db:
        condition: service_healthy

volumes:
  minio-data:
